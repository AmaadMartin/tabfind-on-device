<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TabFind demo</title>
<link rel="stylesheet" href="panel.css" />
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; overflow: hidden; }

  .stage { display: flex; flex-direction: column; height: 100vh; }

  .caption {
    padding: 14px 26px; min-height: 66px; display: flex; flex-direction: column;
    justify-content: center; background: #161b22; border-bottom: 1px solid #30363d;
  }
  .caption-main { font: 600 19px/1.3 system-ui, sans-serif; color: #e6edf3; }
  .caption-sub  { font: 13px/1.4 system-ui, sans-serif; color: #8b949e; margin-top: 3px; }

  .body { flex: 1; display: grid; grid-template-columns: 460px 1fr; gap: 20px;
          padding: 18px 26px; min-height: 0; }

  /*
   * The stage is dark but the panel is shown light, as it would appear in a
   * normal Chrome side panel. panel.css picks its palette from
   * prefers-color-scheme, which here resolves to dark — so the variables have to
   * be pinned back to the light values or the panel renders grey-on-white.
   */
  .panel-wrap {
    border: 1px solid #30363d; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
    color-scheme: light;
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --line: #e3e3e3;
    --accent: #0b57d0; --card: #ffffff; --card-hover: #f6f9fe;
    --warn-bg: #fef7e0; --warn-fg: #7a5900; --live: #0f9d58;
    background: var(--bg); color: var(--fg);
  }
  .panel-wrap .tf { height: 100%; }

  .tabs-col { display: flex; flex-direction: column; min-height: 0; }
  .tabs-head {
    font: 600 11px/1 system-ui, sans-serif; letter-spacing: .09em; color: #8b949e;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .tabs { flex: 1; overflow: hidden; column-count: 2; column-gap: 16px; font-size: 11.5px; }
  .tabrow {
    padding: 3px 8px; margin-bottom: 2px; border-radius: 5px; color: #8b949e;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    break-inside: avoid; border-left: 2px solid transparent;
    transition: background 180ms, color 180ms, border-color 180ms;
  }
  .tabrow.hit {
    background: rgba(63,185,80,.16); color: #7ee787; border-left-color: #3fb950;
    font-weight: 600;
  }
  .tabrow.gone { opacity: .25; text-decoration: line-through; }

  .note {
    margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12px;
    background: rgba(56,139,253,.12); border: 1px solid rgba(56,139,253,.35);
    color: #a5d6ff; opacity: 0; transition: opacity 220ms;
  }
  .note.show { opacity: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="caption">
    <div class="caption-main" id="cap-main">TabFind</div>
    <div class="caption-sub" id="cap-sub"></div>
  </div>
  <div class="body">
    <div class="panel-wrap"><div id="panel"></div></div>
    <div class="tabs-col">
      <div class="tabs-head" id="tabs-head">40 open tabs</div>
      <div class="tabs" id="tabs"></div>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>
<script type="module" src="demo.js"></script>
</body>
</html>
